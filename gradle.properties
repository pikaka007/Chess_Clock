# Support Android builds in directories with non-ASCII names.
then decodes its @argfile (holding this project's non-ASCII path) with UTF-8 while the daemon
wrote it in the platform charset -> every test class fails with ClassNotFoundException.
Kotlin sources are still read as UTF-8 by the Kotlin compiler.
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Support Android builds in directories with non-ASCII names.
# AGP refuses such paths by default; the build is verified end-to-end with this override
# (assembleDebug + testDebugUnitTest + connectedDebugAndroidTest + adb install).
# See docs/environment.md §8 for the measured evidence.
android.overridePathCheck=true
